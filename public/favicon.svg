<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background panel -->
  <rect width="100" height="100" fill="#131314" rx="12" />
  <!-- Glowing border -->
  <rect x="6" y="6" width="88" height="88" fill="none" stroke="#00dbe9" stroke-width="3" rx="8" filter="url(#glow)" opacity="0.8" />
  <!-- Heartbeat ECG Signal -->
  <path d="M 15 50 L 35 50 L 42 25 L 48 75 L 55 43 L 60 57 L 65 50 L 85 50" 
        fill="none" 
        stroke="#00dbe9" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />
</svg>